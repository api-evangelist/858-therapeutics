name: 858 Therapeutics
description: >-
  858 Therapeutics is a clinical-stage biotechnology company based in San Diego, California,
  developing first-in-class and best-in-class small-molecule therapies that target tumor
  dependencies in DNA damage response (DDR) pathways. Its lead program, ETX-19477, is an oral,
  potent, and selective PARG (poly(ADP-ribose) glycohydrolase) inhibitor being evaluated in a
  Phase 1/2 study for patients with advanced solid tumors, exploiting cancer-cell vulnerabilities
  tied to replication stress and defects in replication-fork protection. The company was surfaced
  as a portfolio company of Insight Partners and added to the API Evangelist network. As a
  clinical-stage therapeutics company it publishes a corporate and scientific web presence but
  no public developer, API, or documentation surface, so API artifacts are not applicable.
